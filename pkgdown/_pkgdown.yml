  bootswatch: superhero
authors:
  James Hollway:
    href: https://jameshollway.com
navbar:
  structure:
    left:
    - home
    - intro
    - reference
    - tutorials
    - news
    right:
    - search
    - github
    - cran
  components:
    home:
      icon: fa-home fa-lg
      href: index.html
      aria-label: Go to home
    reference:
      text: Function Overview
      href: reference/index.html
    tutorials:
      text: Tutorials
      menu:
      - text: Diversity and Regression
        href: articles/diversity-and-regression.html
      - text: Diffusion and Learning
        href: articles/diffusion-and-learning.html
    news:
      text: News
      href: news/index.html
    github:
      icon: "fab fa-github fa-lg"
      href: https://github.com/stocnet/infernet
      aria-label: View on Github
    cran:
      icon: "fab fa-r-project"
      href: https://cloud.r-project.org/package=infernet
      aria-label: View on CRAN
articles:
  - title: Tutorials
    desc: |
      Static, read-only versions of the interactive `learnr` tutorials
      bundled with the package. 
      To run them, install `{migraph}` and run `migraph::run_tute("diversity")` 
      or `migraph::run_tute("diffusion")` for the full interactive experience.
    contents:
      - "`articles/diversity-and-regression`"
      - "`articles/diffusion-and-learning`"
reference:
  - title: "Tests"
    desc: >
      Functions for testing a network statistic against random networks,
      networks with the same degrees, or permutations of the network,
      and for testing the parameters and the fit of a model:
    contents:
      - starts_with("test_")
  - title: "Specification"
    desc: >
      The terms of an MRQAP formula and what each measures,
      the terms that suit a network,
      and functions for reading one formula for an MRQAP or an ERGM,
      and for seeing what each model makes of each term:
    contents:
      - terms_mrqap
      - specify_terms
      - specify
  - title: "Regression"
    desc: >
      Functions for regressing a network on nodal and dyadic covariates
      by multiple regression quadratic assignment procedure (MRQAP),
      with random or fixed effects, missing data, panels, and cognitive social structures:
    contents:
      - regression
      - control_mrqap
  - title: "Diffusion"
    desc: >
      Functions for simulating many diffusions on a network,
      to test a model of diffusion against:
    contents:
      - play_diffusions
  - title: "Results"
    desc: >
      Functions for reporting and reading the results of regressions and tests,
      for tidying the results of other network models beside them,
      and for predicting from a regression:
    contents:
      - netreg_results
      - test_results
      - other_results
      - predict
