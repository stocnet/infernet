url: https://stocnet.github.io/infernet/
development:
    mode: auto
template:
  bootstrap: 5
  bootswatch: superhero
authors:
  James Hollway:
    href: https://jameshollway.com
navbar:
  structure:
    left:
    - home
    - intro
    - reference
    - tutorials
    - news
    right:
    - search
    - github
    - cran
  components:
    home:
      icon: fa-home fa-lg
      href: index.html
      aria-label: Go to home
    reference:
      text: Function Overview
      href: reference/index.html
    tutorials:
      text: Tutorials
      menu:
      - text: Diversity and Regression
        href: articles/diversity-and-regression.html
      - text: Diffusion and Learning
        href: articles/diffusion-and-learning.html
      - text: Modelling with ERGMs
        href: articles/modelling-with-ergms.html
    news:
      text: News
      href: news/index.html
    github:
      icon: "fab fa-github fa-lg"
      href: https://github.com/stocnet/infernet
      aria-label: View on Github
    cran:
      icon: "fab fa-r-project"
      href: https://cloud.r-project.org/package=infernet
      aria-label: View on CRAN
articles:
  - title: Tutorials
    desc: |
      Static, read-only versions of the interactive `learnr` tutorials
      bundled with the package. 
      To run them, install `{migraph}` and run `migraph::run_tute("diversity")`,
      `migraph::run_tute("diffusion")`, or `migraph::run_tute("ERGMs")`
      for the full interactive experience.
    contents:
      - "`articles/diversity-and-regression`"
      - "`articles/diffusion-and-learning`"
      - "`articles/modelling-with-ergms`"
redirects:
  - ["reference/regression.html", "reference/estimate_mrqap.html"]
  - ["reference/netreg_results.html", "reference/estimate_mrqap.html"]
  - ["reference/report_tests.html", "reference/test_measures.html"]
  - ["reference/specify.html", "reference/specify_formula.html"]
  - ["reference/predict.html", "reference/predict_mrqap.html"]
# The sections follow the stages of an inference, in order
# (see "The inferential pipeline" in .github/CONTRIBUTING.md).
# The methods that report an object are on the page of the function that
# makes it; the other methods of a fit are on the page of their stage.
reference:
  - title: "Testing"
    desc: >
      Functions for testing one network statistic against random networks,
      networks with the same degrees, or permutations of the network:
    contents:
      - test_measures
  - title: "Specifying"
    desc: >
      Functions for reading one formula for an MRQAP or an ERGM,
      for listing the terms that suit a network,
      and the terms of an MRQAP formula and what each measures,
      and the formula and the terms of a fitted model:
    contents:
      - starts_with("specify_")
      - starts_with("terms_")
  - title: "Estimating"
    desc: >
      Functions for regressing a network on nodal and dyadic covariates
      by multiple regression quadratic assignment procedure (MRQAP),
      with random or fixed effects, missing data, panels, and cognitive social structures,
      the controls of a model,
      and the tidy results of other network models:
    contents:
      - starts_with("estimate_")
      - starts_with("control_")
      - other_results
  - title: "Evaluating"
    desc: >
      Functions for diagnosing issues with a fitted model and its residuals,
      for testing its fit against its simulations,
      for testing its coefficients,
      and for comparing models by their likelihood:
    contents:
      - starts_with("diagnose_")
      - test_fit
      - test_parameter
      - starts_with("evaluate_")
  - title: "Interpreting"
    desc: >
      Functions for predicting from a model,
      and for simulating many diffusions on a network:
    contents:
      - starts_with("predict")
      - starts_with("play_")
