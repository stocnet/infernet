url: https://stocnet.github.io/infernet/
development:
    mode: auto
template:
  bootstrap: 5
  bootswatch: superhero
authors:
  James Hollway:
    href: https://jameshollway.com
navbar:
  structure:
    left:
    - home
    - intro
    - reference
    - tutorials
    - news
    right:
    - search
    - github
    - cran
  components:
    home:
      icon: fa-home fa-lg
      href: index.html
      aria-label: Go to home
    reference:
      text: Function Overview
      href: reference/index.html
    tutorials:
      text: Tutorials
      menu:
      - text: Diversity and Regression
        href: articles/diversity-and-regression.html
      - text: Diffusion and Learning
        href: articles/diffusion-and-learning.html
    news:
      text: News
      href: news/index.html
    github:
      icon: "fab fa-github fa-lg"
      href: https://github.com/stocnet/infernet
      aria-label: View on Github
    cran:
      icon: "fab fa-r-project"
      href: https://cloud.r-project.org/package=infernet
      aria-label: View on CRAN
articles:
  - title: Tutorials
    desc: |
      Static, read-only versions of the interactive `learnr` tutorials
      bundled with the package. Install the package and run `run_tute()`
      for the full interactive experience.
    contents:
      - "`articles/diversity-and-regression`"
      - "`articles/diffusion-and-learning`"
reference:
  - title: "Tests"
    desc: "Functions for testing network statistics against a null distribution:"
    contents:
      - starts_with("test")
  - title: "Formulas"
    desc: "Functions for reading one formula for an MRQAP, goldfish, or ergm, and for seeing what each model makes of each term:"
    contents:
      - specify
  - title: "Regression"
    desc: "Functions for regressing networks on nodal and dyadic covariates:"
    contents:
      - regression
      - control_mrqap
      - predict
  - title: "Diffusion"
    desc: "Functions for simulating many diffusions, to test a model's fit against:"
    contents:
      - play_diffusions
  - title: "Results"
    desc: "Functions for reporting the results of tests and regressions:"
    contents:
      - results
